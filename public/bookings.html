<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Buchungen – PartyDekoMiet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body><div class="shell"><main class="content" id="content">
  <h1 id="h1"></h1>
  <p class="muted" id="intro"></p>
  <div class="filters" id="filters"></div>
  <div id="wrap"><p class="muted" id="loading"></p></div>
</main></div>
<script src="/app.js"></script>
<script>
renderNav('/bookings');
const isStudio = BIZ === 'studio';
$('h1').textContent = isStudio ? t('nav_appointments') : t('nav_bookings');
$('intro').textContent = isStudio ? t('appt_intro') : t('b_intro');
$('loading').textContent = t('loading');

let rows = [];
let filter = 'open';
const FILTERS = [['open', 'b_f_open'], ['CONFIRMED', 'b_f_conf'], ['CANCELLED', 'b_f_canc'], ['all', 'b_f_all']];
const STATUS_TXT = { PENDING: 'b_s_pending', CONFIRMED: 'b_s_confirmed', CANCELLED: 'b_s_cancelled' };

/** 2026-10-17 -> "Fr 17.10." */
function day(iso) {
  if (!iso) return '–';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'de-CH', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function renderFilters() {
  const count = (f) => rows.filter((b) => matches(b, f)).length;
  $('filters').innerHTML = FILTERS.map(([f, key]) =>
    `<button class="${f === filter ? 'on' : ''}" onclick="filter='${f}';render()">${esc(t(key))} (${count(f)})</button>`).join('');
}
const matches = (b, f) => f === 'all' || (f === 'open' ? b.status === 'PENDING' : b.status === f);

/** Party shows a 2-night rental window; Studio shows a single date + time. */
function datesBlock(b) {
  if (isStudio) {
    return `<div class="dates">
        <div><small>${t('a_date')}</small><b>${esc(day(b.date))}</b></div>
        <div><small>${t('a_time')}</small><b>${esc(b.startTime || '')}${b.endTime ? '–' + esc(b.endTime) : ''}</b></div>
      </div>`;
  }
  return `<div class="dates">
      <div><small>${t('b_pickup')}</small><b>${esc(day(b.pickupDate))}</b></div>
      <div><small>${t('b_return')}</small><b>${esc(day(b.returnDate))}</b></div>
    </div>`;
}

/** Party shows the rented set with a shop link; Studio shows who/what was booked. */
function subjectBlock(b) {
  if (isStudio) {
    return `<div class="set">${esc(b.professionalName || '')} · ${esc(b.serviceName || '')}
      ${b.priceChf ? `<div class="muted">CHF ${esc(b.priceChf)}</div>` : ''}</div>`;
  }
  return `<div class="set">${b.productUrl ? `<a href="${esc(b.productUrl)}" target="_blank" rel="noopener">${esc(b.productTitle)} ↗</a>` : esc(b.productTitle)}
    ${b.priceChf ? `<div class="muted">CHF ${esc(b.priceChf)}</div>` : ''}</div>`;
}

function render() {
  renderFilters();
  const list = rows.filter((b) => matches(b, filter));
  const emptyMsg = isStudio ? t('no_appointments') : t('no_bookings');
  if (!list.length) { $('wrap').innerHTML = `<div class="card"><p class="muted" style="margin:0">${emptyMsg}</p></div>`; return; }
  $('wrap').innerHTML = `<div class="bk-list">${list.map((b) => `
    <div class="bk ${esc(b.status)}">
      <div class="top">
        ${pill(t(STATUS_TXT[b.status]) || b.status, b.status === 'CONFIRMED' ? 'ok' : b.status === 'CANCELLED' ? 'err' : 'warn')}
        <span class="muted">${esc(b.id)} · ${esc(fmtDate(b.createdAt))}</span>
      </div>
      ${subjectBlock(b)}
      ${datesBlock(b)}
      <div class="who">${esc(b.customerName || '–')}
        ${b.phone ? `<br><a href="/chats#${esc(b.phone)}">${esc(b.phone)} · ${t('b_open_chat')}</a>` : ''}</div>
      <div class="acts">${actions(b)}</div>
    </div>`).join('')}</div>`;
}

async function refresh() {
  const d = await api('/api/bookings');
  rows = (isStudio ? d.appointments : d.bookings) || [];
  render();
}

/** Only the moves that make sense from the current status are offered. */
function actions(b) {
  const btn = (label, status, cls) =>
    `<button class="${cls}" onclick="setStatus('${esc(b.id)}','${status}')">${esc(label)}</button>`;
  if (b.status === 'PENDING') return btn(t('b_confirm'), 'CONFIRMED', 'primary') + btn(t('b_cancel'), 'CANCELLED', 'ghost');
  if (b.status === 'CONFIRMED') return btn(t('b_cancel'), 'CANCELLED', 'ghost');
  return btn(t('b_pending'), 'PENDING', 'ghost');
}

async function setStatus(id, status) {
  const question = status === 'CANCELLED' ? t('b_cancel_q') : status === 'CONFIRMED' ? t('b_confirm_q') : null;
  if (question && !confirm(question)) return;
  const res = await api(`/api/bookings/${encodeURIComponent(id)}/status`, { method:'POST', body:{ status } });
  if (!res.ok) { alert(res.error || 'error'); return; }
  if (res.calendarWarning) alert(`${t('b_cal_warn')}\n${res.calendarWarning}`);
  refresh();
}

refresh(); setInterval(refresh, 15000);
</script>
</body></html>
