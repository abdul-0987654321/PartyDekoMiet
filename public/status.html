<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Status – PartyDekoMiet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body><div class="shell"><main class="content" id="content">

  <!-- The one thing that matters at a glance: is the bot answering, and the switch. -->
  <div class="hero" id="hero">
    <span class="dot"></span>
    <div class="txt">
      <div class="state" id="hstate">…</div>
      <div class="sub" id="hsub"></div>
    </div>
    <label class="switch" title="">
      <input type="checkbox" id="toggle" disabled>
      <span class="track"></span>
    </label>
  </div>

  <div class="quick" id="quick"></div>
  <div id="alerts"></div>

  <h2 id="h_todo"></h2>
  <div class="card" id="todo"></div>

  <h2 id="h_sys">System</h2>
  <div class="card">
    <div class="row"><span id="l_wa"></span><span id="wa">…</span></div>
    <div class="row"><span id="l_storage"></span><span id="storage">…</span></div>
    <div class="row"><span id="l_catalog"></span><span id="catalog">…</span></div>
    <div class="row"><span id="l_calendar"></span><span id="calendar">…</span></div>
    <div class="row"><span id="l_key"></span><span id="key">…</span></div>
    <div class="row"><span id="l_ai">AI</span><span id="ai">…</span></div>
    <div class="row" id="skiprow" hidden><span id="l_skip"></span><span id="skip">–</span></div>
    <div class="row"><span id="l_owner"></span><span id="owner">…</span></div>
    <div class="row"><span id="l_paused"></span><span id="paused">…</span></div>
  </div>

  <h2 id="h_det">Details</h2>
  <div class="card">
    <div class="row"><span id="l_model"></span><span id="model">…</span></div>
    <div class="row"><span id="l_knowledge"></span><span id="knowledge">…</span></div>
    <div class="row"><span id="l_pending"></span><span id="pending">…</span></div>
    <div class="row"><span id="l_flushed"></span><span id="flushed">…</span></div>
    <div class="row"><span id="l_started"></span><span id="started">…</span></div>
  </div>

</main></div>
<script src="/app.js"></script>
<script>
renderNav('/');
$('h_todo').textContent = t('problems');
for (const [id, key] of [
  ['l_wa','whatsapp'],['l_storage','storage'],['l_catalog','catalog'],['l_calendar','calendar'],
  ['l_key','openai_key'],['l_owner','owner_number'],['l_paused','paused_chats'],
  ['l_model','model'],['l_knowledge','knowledge'],['l_pending','pending_writes'],
  ['l_flushed','last_saved'],['l_started','started'],
]) $(id).textContent = t(key);

$('quick').innerHTML = [
  ['/test','q_test','▶'], ['/chats','q_chats','💬'], ['/bookings','q_book','🗓'], ['/settings','q_set','⚙'],
].map(([href,key,ic]) => `<a href="${href}"><span class="ic">${ic}</span>${t(key)}</a>`).join('');

let saving = false;
$('toggle').onchange = async (e) => {
  if (saving) return;
  saving = true;
  const want = e.target.checked;
  e.target.disabled = true;
  try {
    const res = await api('/api/settings', { method:'POST', body:{ botEnabled: want } });
    if (!res.ok) e.target.checked = !want;
  } catch { e.target.checked = !want; }
  finally { saving = false; await refresh(); }
};

function todoList(d) {
  const items = [];
  if (!d.config.hasSheet) items.push([t('fix_sheet'), '/settings']);
  if (!d.config.hasOpenAiKey) items.push([t('fix_key'), null]);
  // A key that is set but rejected looks fine above, so call it out separately.
  else if (d.ai && d.ai.lastError && /^401/.test(d.ai.lastError)) items.push([t('fix_ai'), null]);
  if (d.whatsapp.status !== 'connected') items.push([t('fix_wa'), '/whatsapp']);
  if (!d.config.calendarConfigured || d.calendarError) items.push([t('fix_cal'), '/settings']);
  if (!d.config.ownerNumber) items.push([t('fix_owner'), '/settings']);
  return items;
}

async function refresh() {
  let d;
  try { d = await api('/api/status'); }
  catch { $('alerts').innerHTML = `<p class="banner err">${t('unreachable')}</p>`; return; }

  // ---- hero ----
  const connected = d.whatsapp.status === 'connected';
  const hero = $('hero');
  hero.className = 'hero ' + (!d.ready ? '' : !connected ? 'bad' : d.config.botEnabled ? 'on' : 'off');
  if (!d.ready) { $('hstate').textContent = t('hero_boot'); $('hsub').textContent = t('hero_boot_sub'); }
  else if (!connected) {
    $('hstate').textContent = t('hero_nowa');
    $('hsub').innerHTML = `${esc(t('hero_nowa_sub'))} <a href="/whatsapp">${esc(t('link_wa'))}</a>`;
  } else {
    $('hstate').textContent = d.config.botEnabled ? t('hero_on') : t('hero_off');
    $('hsub').textContent = d.config.botEnabled ? t('hero_on_sub') : t('hero_off_sub');
  }
  if (!saving) {
    $('toggle').checked = Boolean(d.config.botEnabled);
    $('toggle').disabled = !d.ready;
  }

  // ---- alerts ----
  const al = [];
  for (const [msg, kind] of [[d.bootError,'err'],[d.storageError,'err'],[d.storageWarning,'warn'],[d.calendarError,'warn']])
    if (msg) al.push(`<p class="banner ${kind}">${esc(msg)}</p>`);
  $('alerts').innerHTML = al.join('');

  // ---- to do ----
  const todo = todoList(d);
  $('todo').innerHTML = todo.length
    ? todo.map(([label, href]) => `<div class="row attn"><span>${esc(label)}</span>
        <span>${href ? `<a href="${href}">→</a>` : pill(t('src_env'),'warn')}</span></div>`).join('')
    : `<p class="muted" style="margin:0">${t('all_good')}</p>`;

  // ---- system ----
  $('wa').innerHTML = connected ? pill(t('connected'),'ok')
    : d.whatsapp.status === 'not-wired' ? pill(t('not_wired'),'warn') : pill(d.whatsapp.status,'warn');
  $('storage').innerHTML = d.storage.backend
    ? (d.storage.lastFlushError ? pill(d.storage.backend+' – '+t('error'),'err')
      : pill(d.storage.backend === 'memory' ? 'memory ⚠' : d.storage.backend, d.storage.backend === 'memory' ? 'warn' : 'ok'))
    : pill(t('missing'),'err');
  $('catalog').innerHTML = d.catalog && d.catalog.count
    ? pill(`${d.catalog.count} ${t('products')}`,'ok')
    : pill(d.catalog && d.catalog.lastError ? t('error') : t('loading'),'warn');
  $('calendar').innerHTML = d.config.calendarConfigured && !d.calendarError
    ? pill(t('connected'),'ok') : pill(t('not_configured'),'warn');
  $('key').innerHTML = d.config.hasOpenAiKey ? pill(t('set'),'ok') : pill(t('missing'),'err');
  if (d.ai && d.ai.lastError) {
    const recent = Date.now() - new Date(d.ai.lastErrorAt).getTime() < 30 * 60000;
    $('ai').innerHTML = recent
      ? pill(String(d.ai.lastError).slice(0, 48), 'err')
      : pill(t('ai_ok'), 'ok');
  } else {
    $('ai').innerHTML = pill(t('ai_ok'), 'ok');
  }
  $('owner').textContent = d.config.ownerNumber || t('missing');

  // Why the bot stayed quiet, so an unanswered customer is never a mystery.
  const sk = d.skipped && d.skipped.last;
  $('l_skip').textContent = t('last_skip');
  if (sk && Date.now() - new Date(sk.at).getTime() < 6 * 3600000) {
    $('skiprow').hidden = false;
    $('skip').innerHTML =
      pill(t('sk_' + sk.reason) || sk.reason, sk.reason === 'paused' ? 'warn' : 'err') +
      `<br><span class="muted" style="font-size:12px">${esc(sk.jid.split('@')[0])} · ${esc(fmtDate(sk.at))}</span>`;
  } else {
    $('skiprow').hidden = true;
  }
  $('paused').textContent = d.pausedChats.length ? d.pausedChats.map(p=>p.jid.split('@')[0]).join(', ') : t('none');

  // ---- details ----
  $('model').textContent = d.config.model;
  $('knowledge').textContent = d.knowledge ? `${d.knowledge.source} · ${d.knowledge.faqEntries} FAQ` : '–';
  $('pending').textContent = d.storage.pending ?? '–';
  $('flushed').textContent = fmtDate(d.storage.lastFlushAt);
  $('started').textContent = fmtDate(d.startedAt);
}
refresh(); setInterval(refresh, 10000);
</script>
</body></html>
