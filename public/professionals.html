<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>Professionals – Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body><div class="shell"><main class="content" id="content">
  <div class="pagehead">
    <div class="grow">
      <h1 id="h1"></h1>
      <p class="muted" id="intro"></p>
    </div>
    <button class="primary" id="addbtn"></button>
  </div>
  <div id="alerts"></div>
  <div class="card" id="formcard" hidden></div>
  <div id="wrap"><p class="muted" id="loading"></p></div>
</main></div>
<script src="/app.js"></script>
<script>
renderNav('/professionals');
$('h1').textContent = t('nav_professionals');
$('intro').textContent = t('p_intro');
$('loading').textContent = t('loading');
$('addbtn').textContent = '+ ' + t('add');

let rows = [];
let locations = [];
let editingId = null;

async function refresh() {
  const [p, l] = await Promise.all([api('/api/studio/professionals'), api('/api/studio/locations')]);
  rows = p.professionals || [];
  locations = l.locations || [];
  render();
}

function locationAddress(id) {
  return locations.find((x) => x.id === id)?.address || '';
}

/**
 * Turns what was typed into a location id: the existing one when the name is
 * already known (so a studio is not duplicated by a second spelling), a newly
 * created one otherwise. An address typed against a known name updates it.
 *
 * @returns {Promise<{ok: true, id: string}|{ok: false, error: string}>}
 */
async function resolveLocation(name, address) {
  const wanted = String(name || '').trim();
  if (!wanted) return { ok: true, id: '' };

  const existing = locations.find((l) => l.name.toLowerCase() === wanted.toLowerCase());
  if (existing) {
    if (address && address !== existing.address) {
      await api(`/api/studio/locations/${encodeURIComponent(existing.id)}`, { method: 'PATCH', body: { address } });
    }
    return { ok: true, id: existing.id };
  }

  const res = await api('/api/studio/locations', { method: 'POST', body: { name: wanted, address } });
  if (!res.ok) return { ok: false, error: res.error || t('save_err') };
  return { ok: true, id: res.location.id };
}

function locationName(id) {
  const l = locations.find((x) => x.id === id);
  return l ? l.name : '';
}

function render() {
  if (!rows.length) {
    // The location is typed into the same form now, so there is nothing to do
    // first and nowhere else to be sent.
    $('wrap').innerHTML = emptyState({
      icon: '👤', title: t('no_professionals'), text: t('p_intro'),
      actionLabel: '+ ' + t('add'), onclick: 'addNew',
    });
    return;
  }
  $('wrap').innerHTML = `<div class="tiles">${rows.map((p) => {
    const langs = (Array.isArray(p.languages) ? p.languages.join(', ') : p.languages) || '';
    return `
    <div class="tile ${p.active ? '' : 'off'}">
      <div class="head">
        ${p.photoFileId
          ? `<img class="shot" src="/api/studio/photo/${esc(p.photoFileId)}" alt="">`
          : `<span class="shot">${esc(p.name.trim().charAt(0).toUpperCase() || '?')}</span>`}
        <div class="title">
          <b>${esc(p.name)}</b>
          <span>${esc(p.locationId ? locationName(p.locationId) : t('p_no_location'))}</span>
        </div>
        ${p.active ? '' : pill(t('inactive'), 'warn')}
      </div>
      <div class="facts">
        <div><dt>${t('p_lang_short')}</dt><dd>${langs ? esc(langs) : `<span class="muted">${t('p_none_lang')}</span>`}</dd></div>
        <div><dt>${t('p_hours')}</dt><dd>${p.workingHours ? esc(p.workingHours) : `<span class="muted">${t('p_none_hours')}</span>`}</dd></div>
        ${p.age ? `<div><dt>${t('p_age')}</dt><dd>${esc(p.age)}</dd></div>` : ''}
      </div>
      ${p.photoFileId ? '' : `<div class="note"><span class="pill warn">${t('p_no_photo')}</span></div>`}
      <div class="acts">
        <button class="ghost" onclick="startEdit('${esc(p.id)}')">${t('edit')}</button>
        <button class="ghost" onclick="remove('${esc(p.id)}')">${t('delete')}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function formHtml(p) {
  const langs = Array.isArray(p?.languages) ? p.languages.join(', ') : (p?.languages || '');
  return `
    <div class="field"><label>${t('name')}</label><input type="text" id="f_name" value="${esc(p?.name || '')}"></div>
    <div class="field"><label>${t('p_age')}</label><input type="number" id="f_age" value="${esc(p?.age || '')}" min="18" max="99"></div>
    <div class="field"><label>${t('p_languages')}</label><input type="text" id="f_languages" value="${esc(langs)}"></div>
    <!-- Typed here, not picked from a page of its own. A location is only ever
         needed while filling in a professional, and a location that does not
         exist yet is the normal case the first time - so it is created from
         what is typed. Existing ones are offered while typing, so the same
         studio is not entered twice under two spellings. -->
    <div class="field"><label>${t('p_location')}</label>
      <p class="help">${t('p_location_help')}</p>
      <input type="text" id="f_locationName" list="loclist" autocomplete="off"
             value="${esc(p?.locationId ? locationName(p.locationId) : '')}" placeholder="${esc(t('p_location_ph'))}">
      <datalist id="loclist">${locations.map((l) => `<option value="${esc(l.name)}">`).join('')}</datalist>
    </div>
    <div class="field"><label>${t('p_address')}</label>
      <input type="text" id="f_locationAddress" value="${esc(locationAddress(p?.locationId))}" placeholder="Langstrasse 175, 8004 Zürich">
    </div>
    <!-- Her own number, so a request for her reaches her even when the
         customer wrote to the Studio's main number - and so she can answer
         J or N to confirm it. -->
    <div class="field"><label>${t('p_whatsapp')}</label>
      <p class="help">${t('p_whatsapp_help')}</p>
      <input type="text" id="f_whatsapp" value="${esc(p?.whatsapp || '')}" placeholder="41791234567">
    </div>
    <div class="field"><label>${t('p_hours')}</label><input type="text" id="f_workingHours" value="${esc(p?.workingHours || '')}" placeholder="Mo-Fr 10-18"></div>
    <div class="field"><label class="check"><input type="checkbox" id="f_active" ${p?.active !== false ? 'checked' : ''}> ${t('active')}</label></div>
    <div class="field"><label>${t('photo')}</label>
      <input type="file" id="f_photo" accept="image/*">
      ${p?.photoFileId ? `<div style="margin-top:8px"><img src="/api/studio/photo/${esc(p.photoFileId)}" style="max-height:100px;border-radius:8px"></div>` : ''}
    </div>
    <div class="actions inline">
      <button class="primary" id="f_save">${t('save')}</button>
      <button class="ghost" id="f_cancel">${t('reset')}</button>
      <span id="f_msg" class="muted"></span>
    </div>`;
}

function openForm(p) {
  editingId = p?.id || null;
  const card = $('formcard');
  card.hidden = false;
  card.innerHTML = formHtml(p);
  $('f_cancel').onclick = closeForm;
  $('f_save').onclick = save;
}
function closeForm() { $('formcard').hidden = true; $('formcard').innerHTML = ''; editingId = null; }

function addNew() { openForm(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('addbtn').onclick = addNew;
function startEdit(id) { openForm(rows.find((p) => p.id === id)); }

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function save() {
  $('f_msg').textContent = t('saving');

  const loc = await resolveLocation($('f_locationName').value, $('f_locationAddress').value.trim());
  if (!loc.ok) {
    $('f_msg').textContent = '';
    $('alerts').innerHTML = `<p class="banner err">${esc(loc.error)}</p>`;
    return;
  }

  const patch = {
    name: $('f_name').value.trim(),
    age: $('f_age').value ? Number($('f_age').value) : '',
    languages: $('f_languages').value,
    locationId: loc.id,
    whatsapp: $('f_whatsapp').value,
    workingHours: $('f_workingHours').value,
    active: $('f_active').checked,
  };
  const res = editingId
    ? await api(`/api/studio/professionals/${encodeURIComponent(editingId)}`, { method: 'PATCH', body: patch })
    : await api('/api/studio/professionals', { method: 'POST', body: patch });
  if (!res.ok) { $('f_msg').textContent = ''; $('alerts').innerHTML = `<p class="banner err">${esc(res.error || t('save_err'))}</p>`; return; }

  const id = res.professional.id;
  const file = $('f_photo').files[0];
  if (file) {
    const base64 = await fileToBase64(file);
    await api(`/api/studio/professionals/${encodeURIComponent(id)}/photo`, { method: 'POST', body: { name: file.name, mimeType: file.type, base64 } });
  }
  $('alerts').innerHTML = '';
  closeForm();
  refresh();
}

async function remove(id) {
  if (!(await ask(t('delete_confirm')))) return;
  await api(`/api/studio/professionals/${encodeURIComponent(id)}`, { method: 'DELETE' });
  refresh();
}

refresh();
</script>
</body></html>
