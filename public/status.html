<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Status – PartyDekoMiet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body><div class="shell"><main class="content" id="content">
  <h1 id="h1"></h1>
  <div id="alerts"></div>
  <div class="card">
    <div class="row"><span id="l_bot"></span><span id="ready">…</span></div>
    <div class="row"><span id="l_wa"></span><span id="wa">…</span></div>
    <div class="row"><span id="l_storage"></span><span id="storage">…</span></div>
    <div class="row"><span id="l_catalog"></span><span id="catalog">…</span></div>
    <div class="row"><span id="l_calendar"></span><span id="calendar">…</span></div>
  </div>
  <div class="card">
    <div class="row"><span id="l_model"></span><span id="model">…</span></div>
    <div class="row"><span id="l_key"></span><span id="key">…</span></div>
    <div class="row"><span id="l_knowledge"></span><span id="knowledge">…</span></div>
    <div class="row"><span id="l_owner"></span><span id="owner">…</span></div>
    <div class="row"><span id="l_paused"></span><span id="paused">…</span></div>
  </div>
  <div class="card">
    <div class="row"><span id="l_pending"></span><span id="pending">…</span></div>
    <div class="row"><span id="l_flushed"></span><span id="flushed">…</span></div>
    <div class="row"><span id="l_started"></span><span id="started">…</span></div>
  </div>
</main></div>
<script src="/app.js"></script>
<script>
renderNav('/');
$('h1').textContent = 'PartyDekoMiet Bot';
for (const [id, key] of [
  ['l_bot','bot'],['l_wa','whatsapp'],['l_storage','storage'],['l_catalog','catalog'],
  ['l_calendar','calendar'],['l_pending','pending_writes'],['l_flushed','last_saved'],
  ['l_started','started'],['l_model','model'],['l_key','openai_key'],
  ['l_knowledge','knowledge'],['l_owner','owner_number'],['l_paused','paused_chats'],
]) $(id).textContent = t(key);

async function refresh() {
  let d;
  try { d = await api('/api/status'); }
  catch { $('alerts').innerHTML = `<p class="banner err">${t('unreachable')}</p>`; return; }

  const al = [];
  for (const [msg, kind] of [[d.bootError,'err'],[d.storageError,'err'],[d.storageWarning,'warn'],[d.calendarError,'warn']])
    if (msg) al.push(`<p class="banner ${kind}">${esc(msg)}</p>`);
  $('alerts').innerHTML = al.join('');

  $('ready').innerHTML = d.ready
    ? (d.config.botEnabled ? pill(t('ready'),'ok') : pill('OFF','warn'))
    : pill(t('starting'),'warn');
  $('wa').innerHTML = d.whatsapp.status === 'connected' ? pill(t('connected'),'ok')
    : d.whatsapp.status === 'not-wired' ? pill(t('not_wired'),'warn') : pill(d.whatsapp.status,'warn');
  $('storage').innerHTML = d.storage.backend
    ? (d.storage.lastFlushError ? pill(d.storage.backend+' – '+t('error'),'err') : pill(d.storage.backend,'ok'))
    : pill(t('missing'),'err');
  $('catalog').innerHTML = d.catalog && d.catalog.count
    ? pill(`${d.catalog.count} ${t('products')}`,'ok')
    : pill(d.catalog && d.catalog.lastError ? t('error') : t('loading'),'warn');
  $('calendar').innerHTML = d.config.calendarConfigured && !d.calendarError
    ? pill(t('connected'),'ok') : pill(t('not_configured'),'warn');
  $('pending').textContent = d.storage.pending ?? '–';
  $('flushed').textContent = fmtDate(d.storage.lastFlushAt);
  $('started').textContent = fmtDate(d.startedAt);
  $('model').textContent = d.config.model;
  $('key').innerHTML = d.config.hasOpenAiKey ? pill(t('set'),'ok') : pill(t('missing'),'err');
  $('knowledge').textContent = d.knowledge ? `${d.knowledge.source} · ${d.knowledge.faqEntries} FAQ` : '–';
  $('owner').textContent = d.config.ownerNumber || t('missing');
  $('paused').textContent = d.pausedChats.length ? d.pausedChats.map(p=>p.jid.split('@')[0]).join(', ') : t('none');
}
refresh(); setInterval(refresh, 10000);
</script>
</body></html>
