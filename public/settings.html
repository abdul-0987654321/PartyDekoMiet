<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einstellungen – PartyDekoMiet Bot</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header id="nav"></header>
  <h1 id="title">Einstellungen</h1>
  <p class="muted" id="intro"></p>
  <div id="alerts"></div>
  <form id="form"><p class="muted" id="loading"></p></form>
</main>
<script src="/app.js"></script>
<script>
renderNav('/settings');
$('title').textContent = t('nav_settings');
$('intro').textContent = t('settings_intro');
$('loading').textContent = t('loading');

const GROUPS = ['bot', 'contacts', 'business', 'shop', 'calendar', 'dashboard'];
let schema = [];

function fieldHtml(s) {
  const label = s.label[LANG] || s.label.de;
  const help = s.help ? (s.help[LANG] || s.help.de) : '';
  const srcLabel = { env: t('src_env'), dashboard: t('src_dashboard'), default: t('src_default') }[s.source];
  let input;

  if (s.type === 'boolean') {
    input = `<input type="checkbox" id="f_${s.key}" ${s.value ? 'checked' : ''}>`;
  } else if (s.type === 'enum') {
    input = `<select id="f_${s.key}">` +
      s.options.map((o) => `<option value="${esc(o)}" ${o === s.value ? 'selected' : ''}>${esc(o)}</option>`).join('') +
      `</select>`;
  } else if (s.type === 'number') {
    input = `<input type="number" id="f_${s.key}" value="${esc(s.value)}"` +
      (s.min !== undefined ? ` min="${s.min}"` : '') + (s.max !== undefined ? ` max="${s.max}"` : '') + '>';
  } else {
    input = `<input type="text" id="f_${s.key}" value="${esc(s.value)}" placeholder="${esc(s.placeholder || '')}">`;
  }

  return `<div class="field">
    <label for="f_${s.key}">${esc(label)}<span class="src">${esc(srcLabel)}</span></label>
    ${help ? `<p class="help">${esc(help)}</p>` : ''}
    ${input}
  </div>`;
}

function render() {
  const groups = GROUPS.filter((g) => schema.some((s) => s.group === g));
  $('form').innerHTML = groups.map((g) => `
    <h2>${t('g_' + g)}</h2>
    <div class="card">${schema.filter((s) => s.group === g).map(fieldHtml).join('')}</div>
  `).join('') + `
    <div class="actions inline">
      <button class="primary" type="button" id="save" style="width:auto">${t('save')}</button>
      <button class="ghost" type="button" id="reload">${t('refresh')}</button>
      <span id="msg" class="muted"></span>
    </div>`;

  $('save').onclick = save;
  $('reload').onclick = load;
}

function collect() {
  const patch = {};
  for (const s of schema) {
    const el = $('f_' + s.key);
    if (!el) continue;
    patch[s.key] = s.type === 'boolean' ? el.checked : s.type === 'number' ? Number(el.value) : el.value;
  }
  return patch;
}

async function save() {
  $('msg').textContent = t('saving');
  $('alerts').innerHTML = '';
  const res = await api('/api/settings', { method: 'POST', body: collect() });
  if (!res.ok) {
    $('msg').textContent = '';
    $('alerts').innerHTML = `<p class="banner err">${(res.errors || [res.error]).map(esc).join('<br>')}</p>`;
    return;
  }
  schema = res.settings;
  render();
  $('msg').textContent = t('saved') + (res.changed.length ? ` (${res.changed.join(', ')})` : '');
  // The dashboard language is itself a setting: follow it unless this browser overrode it.
  const dash = schema.find((s) => s.key === 'dashboardLanguage');
  if (dash && !localStorage.getItem('dashLang')) setLang(dash.value);
}

async function load() {
  const res = await api('/api/settings');
  schema = res.settings || [];
  render();
}
load();
</script>
</body>
</html>
