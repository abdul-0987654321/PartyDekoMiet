<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Einstellungen – PartyDekoMiet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body><div class="shell"><main class="content" id="content">
  <h1 id="h1"></h1>
  <p class="muted" id="intro"></p>
  <div class="chips" id="chips"></div>
  <div id="alerts"></div>
  <form id="form" onsubmit="return false"><p class="muted" id="loading"></p></form>
</main></div>
<script src="/app.js"></script>
<script>
renderNav('/settings');
$('h1').textContent = t('nav_settings');
$('intro').textContent = t('settings_intro');
$('loading').textContent = t('loading');

// Each business sees only the settings relevant to it; 'bot'/'dashboard' are
// shared layout groups shown either way (the bot's name there still makes
// sense read as "this number's bot").
const GROUPS = BIZ === 'studio'
  ? ['bot', 'studio', 'dashboard']
  : ['bot', 'contacts', 'business', 'shop', 'calendar', 'dashboard'];
let schema = [];
let serviceAccountEmail = null;

/**
 * The calendar field alone is not enough to connect a calendar: the client
 * also has to SHARE that calendar with this address first, in Google
 * Calendar itself, and that address lives in a JSON key file, not anywhere
 * in this dashboard otherwise. Studio reuses the exact same address as
 * Party (one shared Google service account, see HANDOFF.md) - only the
 * calendar itself, and its ID pasted into the field below, differ.
 */
function calendarHint() {
  if (!serviceAccountEmail) {
    return `<p class="banner warn">${esc(t('cal_not_ready'))}</p>`;
  }
  return `<div class="card" style="margin-bottom:14px">
    <p style="margin:0 0 8px"><b>${esc(t('cal_hint'))}</b></p>
    <div class="inline">
      <code id="sa_email" style="background:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;word-break:break-all">${esc(serviceAccountEmail)}</code>
      <button class="ghost" type="button" onclick="copyEmail()">${esc(t('copy'))}</button>
    </div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">${esc(t('cal_steps'))}</p>
  </div>`;
}
function copyEmail() {
  navigator.clipboard?.writeText(serviceAccountEmail);
  const btn = document.activeElement;
  if (btn) { const old = btn.textContent; btn.textContent = t('copied'); setTimeout(() => { btn.textContent = old; }, 1500); }
}

function fieldHtml(s) {
  const label = s.label[LANG] || s.label.de;
  const help = s.help ? (s.help[LANG] || s.help.de) : '';
  const src = { env: t('src_env'), dashboard: t('src_dashboard'), default: t('src_default') }[s.source];
  let input;
  if (s.type === 'boolean') input = `<label class="check"><input type="checkbox" id="f_${s.key}" ${s.value?'checked':''}></label>`;
  else if (s.type === 'enum') input = `<select id="f_${s.key}">${s.options.map(o=>{
      const ol = s.optionLabels && s.optionLabels[o];
      const txt = ol ? (ol[LANG] || ol.de) : o;
      return `<option value="${esc(o)}" ${o===s.value?'selected':''}>${esc(txt)}</option>`;
    }).join('')}</select>`;
  else if (s.type === 'number') input = `<input type="number" inputmode="numeric" id="f_${s.key}" value="${esc(s.value)}"${s.min!==undefined?` min="${s.min}"`:''}${s.max!==undefined?` max="${s.max}"`:''}>`;
  else input = `<input type="text" id="f_${s.key}" value="${esc(s.value)}" placeholder="${esc(s.placeholder||'')}">`;
  return `<div class="field"><label for="f_${s.key}">${esc(label)}<span class="src">${esc(src)}</span></label>
    ${help?`<p class="help">${esc(help)}</p>`:''}${input}</div>`;
}

function render() {
  const groups = GROUPS.filter(g => schema.some(s => s.group === g));
  $('chips').innerHTML = groups.map(g => `<a href="#g_${g}">${esc(t('g_'+g))}</a>`).join('');
  $('form').innerHTML = groups.map(g => {
    const all = schema.filter(s => s.group === g);
    const main = all.filter(s => !s.advanced), adv = all.filter(s => s.advanced);
    const hint = (g === 'calendar' || g === 'studio') ? calendarHint() : '';
    return `<section class="group" id="g_${g}"><h2>${t('g_'+g)}</h2>
      ${hint}
      <div class="card">
      ${main.map(fieldHtml).join('')}
      ${adv.length ? `<details class="adv"><summary>${esc(t('s_adv'))} (${adv.length})</summary>${adv.map(fieldHtml).join('')}</details>` : ''}
    </div></section>`;
  }).join('') + `<div class="actions inline">
      <button class="primary" type="button" id="save">${t('save')}</button>
      <button class="ghost" type="button" id="reload">${t('refresh')}</button>
      <span id="msg" class="muted"></span></div>`;
  $('save').onclick = save;
  $('reload').onclick = load;
  $('form').oninput = () => { $('msg').textContent = t('s_unsaved'); };
}

function collect() {
  const patch = {};
  for (const s of schema) {
    const el = $('f_'+s.key); if (!el) continue;
    patch[s.key] = s.type==='boolean' ? el.checked : s.type==='number' ? Number(el.value) : el.value;
  }
  return patch;
}

async function save() {
  $('msg').textContent = t('saving'); $('alerts').innerHTML = '';
  const res = await api('/api/settings', { method:'POST', body: collect() });
  if (!res.ok) {
    $('msg').textContent = '';
    $('alerts').innerHTML = `<p class="banner err">${(res.errors||[res.error]).map(esc).join('<br>')}</p>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  schema = res.settings; render();
  const names = res.changed.map(k => { const d = schema.find(x => x.key === k); return d ? (d.label[LANG] || d.label.de) : k; });
  $('msg').textContent = t('saved') + (names.length ? ` – ${names.join(', ')}` : '');
  const dash = schema.find(s => s.key === 'dashboardLanguage');
  if (dash && !localStorage.getItem('dashLang')) setLang(dash.value);
}

async function load() {
  const [s, st] = await Promise.all([api('/api/settings'), api('/api/status')]);
  schema = s.settings || [];
  serviceAccountEmail = st.config?.serviceAccountEmail || null;
  render();
}
load();
</script>
</body></html>
